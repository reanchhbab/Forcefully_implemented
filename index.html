<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>នីតិវិធីអនុវត្តដោយបង្ខំលើអចលនវត្ថុ</title>
<meta property="og:title" content="នីតិវិធីអនុវត្តដោយបង្ខំលើអចលនវត្ថុ តាមច្បាប់កម្ពុជា">
<meta property="og:description" content="ស្វែងយល់ជំហានម្តងមួយៗ ជាភាសាសាមញ្ញ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&family=Noto+Serif+Khmer:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f6;--ink:#14262b;--mute:#54666b;--a:#4b3f8f;--a2:#eeecf8;--b:#0f6b5c;--b2:#e3f3ef;--line:#cfd8d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Noto Sans Khmer",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Noto Serif Khmer",serif;line-height:1.5;margin:.3em 0}
h1{font-size:1.5rem}h2{font-size:1.3rem}
.note{font-size:.88rem;color:var(--mute);margin:0 0 20px}
.crumb{font-size:.9rem;margin-bottom:12px}
a{color:var(--a)}
.path{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--line)}
.path li{position:relative;margin:0 0 12px}
.path li::before{content:"";position:absolute;left:-30px;top:20px;width:13px;height:13px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;text-decoration:none;background:var(--bg2);border:1px solid var(--c);border-radius:10px;padding:12px 16px;cursor:pointer}
.card:hover,.card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.card b{display:block;color:var(--c)}
.p0{--c:var(--a);--bg2:var(--a2)}.p1{--c:var(--b);--bg2:var(--b2)}
.legend{font-size:.88rem;display:flex;gap:16px;flex-wrap:wrap;margin:0 0 16px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;background:var(--c)}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.btn{font:inherit;background:var(--c);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;text-decoration:none}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
footer{margin-top:36px;font-size:.82rem;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
@media(prefers-reduced-motion:no-preference){#v{animation:f .25s}@keyframes f{from{opacity:0}}}
</style>
</head>
<body>
<main>
<div id="v"></div>
<footer>ព័ត៌មានទូទៅសម្រាប់ការសិក្សា មិនមែនជាការប្រឹក្សាច្បាប់ទេ។ សម្រាប់ករណីជាក់ស្តែង សូមពិគ្រោះមេធាវី ឬក្រឡាបញ្ជីសាលាដំបូង។ ធ្វើបច្ចុប្បន្នភាព៖ កញ្ញា ២០២៦។</footer>
</main>
<script>
const S=[
{t:"ប័ណ្ណអនុវត្ត និងការបញ្ជាក់ឱ្យអនុវត្ត",p:0,s:[
{t:"ប័ណ្ណអនុវត្តគឺអ្វី",d:"<p>ប័ណ្ណអនុវត្តគឺឯកសារដែលបញ្ជាក់ថា អ្នកមានសិទ្ធិទាមទារ។ ឧទាហរណ៍ អ្នកប្តឹងអ្នកខ្ចីលុយដែលមិនសង ហើយតុលាការសម្រេចថាគេត្រូវសងអ្នក។</p><p>បើគ្មានប័ណ្ណនេះ អ្នកមិនអាចសុំតុលាការរឹបអូស ឬលក់ទ្រព្យរបស់កូនបំណុលបានទេ។</p>"},
{t:"ប្រភេទប័ណ្ណអនុវត្ត",d:"<ul><li>សាលក្រមស្ថាពររបស់តុលាការកម្ពុជា (លែងអាចប្តឹងឧទ្ធរណ៍បាន)</li><li>សេចក្តីសម្រេចលើការទារបំណុល</li><li>លិខិតដែលធ្វើនៅសារការី</li><li>កំណត់ហេតុផ្សះផ្សាដែលតុលាការធ្វើ</li><li>សេចក្តីសម្រេចអាជ្ញាកណ្តាល ឬសាលក្រមបរទេស ដែលត្រូវទទួលស្គាល់នៅកម្ពុជាជាមុន</li></ul>"},
{t:"ការបញ្ជាក់ឱ្យអនុវត្តគឺអ្វី",d:"<p>គឺត្រាបញ្ជាក់ពីក្រឡាបញ្ជីតុលាការ (ឬសារការី) សរសេរនៅខាងក្រោមច្បាប់ចម្លងប័ណ្ណអនុវត្ត ថាឯកសារនេះអាចប្រើបង្ខំឱ្យសងបានពិតប្រាកដ។</p><p>ប្រៀបដូចវិក្កយបត្រដែលត្រូវមានត្រាផ្លូវការ ទើបយកទៅប្រើបាន។ ជាទូទៅ ការអនុវត្តត្រូវប្រើច្បាប់ចម្លងដែលមានការបញ្ជាក់នេះ លើកលែងបណ្តឹងតូចតាច។</p>"},
{t:"របៀបស្នើសុំការបញ្ជាក់",d:"<ol><li>ធ្វើពាក្យសុំជាលាយលក្ខណ៍អក្សរ ទៅក្រឡាបញ្ជីតុលាការ។</li><li>បើសាលក្រមមិនទាន់ស្ថាពរ ត្រូវភ្ជាប់ឯកសារបញ្ជាក់ថាបានស្ថាពរ។</li><li>ក្រឡាបញ្ជីសរសេរ និងបញ្ជាក់ប្រយោគអនុវត្ត។</li><li>បើបដិសេធដោយខុសច្បាប់ អាចដាក់ពាក្យតវ៉ា។</li></ol>"}]},
{t:"ដាក់ពាក្យសុំអនុវត្តដោយបង្ខំ",p:0,s:[
{t:"ដាក់ពាក្យនៅទីណា",d:"<p>ជាទូទៅ ដាក់ទៅសាលាដំបូងដែលអចលនវត្ថុនោះស្ថិតនៅក្នុងដែនសមត្ថកិច្ចរបស់វា។</p>"},
{t:"ឯកសារត្រូវភ្ជាប់",d:"<p>ប័ណ្ណអនុវត្តដែលមានការបញ្ជាក់ និងឯកសារបង្ហាញកម្មសិទ្ធិអចលនវត្ថុ ដែលអាចស្នើពីសុរិយោដី ឬអាជ្ញាធរមូលដ្ឋាន។</p>"}]},
{t:"រឹបអូស",p:0,s:[
{t:"សេចក្តីសម្រេចចាប់ផ្តើម",d:"<p>តុលាការពិនិត្យពាក្យ ហើយចេញសេចក្តីសម្រេចចាប់ផ្តើមនីតិវិធី រួចជូនដំណឹងដល់កូនបំណុល។</p>"},
{t:"ចុះបញ្ជីរឹបអូស",d:"<p>សេចក្តីសម្រេចត្រូវចុះបញ្ជីនៅសុរិយោដី។ បន្ទាប់មក កូនបំណុលលែងអាចបង្វែរអចលនវត្ថុនោះទៅអ្នកដទៃបាន។</p>"}]},
{t:"វាយតម្លៃអចលនវត្ថុ",p:0,s:[
{t:"អ្នកវាយតម្លៃ",d:"<p>តុលាការតែងតាំងអ្នកវាយតម្លៃ ដើម្បីកំណត់តម្លៃអចលនវត្ថុ ហើយអាចពិនិត្យស្ថានភាពកាន់កាប់ និងបន្ទុកលើអចលនវត្ថុ។</p>"},
{t:"តម្លៃអប្បបរមា",d:"<p>តម្លៃដែលវាយបានជួយកំណត់តម្លៃអប្បបរមាសម្រាប់លក់។</p>"}]},
{t:"ប្រកាសលក់",p:1,s:[
{t:"កំណត់ថ្ងៃលក់",d:"<p>តុលាការកំណត់កាលបរិច្ឆេទ និងទីកន្លែងលក់។</p>"},
{t:"ជូនដំណឹងសាធារណៈ",d:"<p>សេចក្តីជូនដំណឹងត្រូវផ្សព្វផ្សាយជាសាធារណៈ។ ក្រសួងយុត្តិធម៌មានវេទិកាអនឡាញផ្សាយសេចក្តីជូនដំណឹងលក់ដោយបង្ខំរបស់សាលាដំបូងនានា។</p>"}]},
{t:"លក់ដេញថ្លៃ",p:1,s:[
{t:"ការចូលរួមដេញថ្លៃ",d:"<p>អ្នកចង់ទិញដាក់ពាក្យចូលរួម ហើយអាចត្រូវដាក់ប្រាក់កក់។ សូមពិនិត្យលក្ខខណ្ឌនៅតុលាការ។</p>"},
{t:"អ្នកឈ្នះ",d:"<p>អ្នកផ្តល់តម្លៃខ្ពស់បំផុត ដែលមិនទាបជាងតម្លៃអប្បបរមា ត្រូវតុលាការសម្រេចឱ្យទិញ។</p>"}]},
{t:"បង់ប្រាក់ និងផ្ទេរកម្មសិទ្ធិ",p:1,s:[
{t:"បង់ថ្លៃទិញ",d:"<p>អ្នកទិញបង់ថ្លៃទិញតាមកំណត់របស់តុលាការ។</p>"},
{t:"ផ្ទេរកម្មសិទ្ធិ",d:"<p>កម្មសិទ្ធិត្រូវផ្ទេរ និងចុះបញ្ជីនៅសុរិយោដីជាឈ្មោះអ្នកទិញ។ បើចាំបាច់ ត្រូវមានការប្រគល់អចលនវត្ថុតាមនីតិវិធី។</p>"}]},
{t:"ចែកប្រាក់ដល់ម្ចាស់បំណុល",p:1,s:[
{t:"ចែកតាមអាទិភាព",d:"<p>តុលាការចែកប្រាក់ពីការលក់ទៅម្ចាស់បំណុលតាមលំដាប់អាទិភាព។</p>"},
{t:"ប្រាក់សល់",d:"<p>ប្រាក់សល់ (បើមាន) ត្រូវប្រគល់ឱ្យកូនបំណុល។</p>"}]}
];
const K=n=>String(n).replace(/\d/g,d=>"០១២៣៤៥៦៧៨៩"[d]);
const v=document.getElementById("v");
function render(){
const [a,b]=location.hash.slice(1).split("/").map(x=>parseInt(x)-1);
const st=S[a],sb=st&&S[a].s[b];
let h="";
if(!st){
h=`<h1>នីតិវិធីអនុវត្តដោយបង្ខំលើអចលនវត្ថុ</h1><p class="note">ច្បាប់កម្ពុជា៖ ចុចលើស្ថានីយនីមួយៗ ដើម្បីមើលជំហាន និងការពន្យល់។</p><div class="legend"><span class="p0"><i></i>ដំណាក់កាលត្រៀម</span><span class="p1"><i></i>ដំណាក់កាលលក់ និងចែកចាយ</span></div><ol class="path">`+
S.map((x,i)=>`<li class="p${x.p}"><a class="card" href="#${i+1}"><b>ស្ថានីយទី${K(i+1)}</b>${x.t}</a></li>`).join("")+`</ol>`;
}else if(!sb){
h=`<div class="crumb"><a href="#">ទំព័រដើម</a></div><h2 class="p${st.p}" style="color:var(--c)">${K(a+1)}. ${st.t}</h2><ol class="path p${st.p}" style="margin-top:16px">`+
st.s.map((x,i)=>`<li><a class="card" href="#${a+1}/${i+1}"><b>ជំហាន ${K(a+1)}.${K(i+1)}</b>${x.t}</a></li>`).join("")+`</ol>`;
}else{
const pv=b>0?`#${a+1}/${b}`:`#${a+1}`,nx=b<st.s.length-1?`#${a+1}/${b+2}`:(a<S.length-1?`#${a+2}`:"#");
h=`<div class="crumb"><a href="#">ទំព័រដើម</a> › <a href="#${a+1}">ស្ថានីយទី${K(a+1)}</a></div><h2>${K(a+1)}.${K(b+1)} ${sb.t}</h2><div class="box">${sb.d}</div><div class="nav p${st.p}"><a class="btn g" href="${pv}">‹ ថយក្រោយ</a><a class="btn" href="${nx}">បន្ទាប់ ›</a></div>`;
}
v.innerHTML=h;scrollTo(0,0);
}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
